---
# Externe Festplatten für /etc/fstab (verwendet von 'roles/drive')
host_drives:
  - path: /mnt/drive
    uuid: "f601b704-44be-4bf4-b5e1-0714e03bcdcb"
    fstype: ext4
    opts: "defaults,nofail"

# Docker Compose Konfiguration (verwendet von 'roles/docker_compose' & 'playbooks/update.yml')
compose_repo_url: "https://github.com/NicoGartmann/docker-config.git"
compose_repo_dest: "/opt/services"
compose_repo_version: "main"

# Liste der Themen-Stacks relativ zu 'compose_repo_dest'
compose_files:
  - "connectivity/adguard.yml"
  - "connectivity/proxy.yml"
  - "connectivity/twingate.yml"
  - "documents/docker-compose.yml"
  - "storage/samba.yml"
  - "monitoring/agent.yml"

# Host-Verzeichnisse, die vor dem Start der Container existieren müssen
compose_directories:
  - { path: /opt/adguard/work, owner: root, group: root, mode: "0755" }
  - { path: /opt/adguard/conf, owner: root, group: root, mode: "0755" }
  - { path: /opt/nginx-proxy-manager, owner: root, group: root, mode: "0755" }
  - { path: /mnt/drive/paperless, owner: "1000", group: "1000", mode: "0755" }
  - { path: /mnt/drive/nas, owner: "1000", group: "1000", mode: "0755" }

# Pfade und Geheimnisse für {{ compose_repo_dest }}/.env (vault_* Werte kommen aus vaults/raspberrypi.yml)
compose_env_vars:
  - { key: "ADGUARD_CONFIG", value: "/opt/adguard" }
  - { key: "ADGUARD_WEB_PORT", value: "8080" }
  - { key: "NPM_DATA", value: "/opt/nginx-proxy-manager" }
  - { key: "PAPERLESS_DATA", value: "/mnt/drive/paperless" }
  - { key: "SAMBA_DATA", value: "/mnt/drive/nas" }
  - { key: "TWINGATE_NETWORK", value: "{{ vault_twingate_network }}" }
  - { key: "TWINGATE_ACCESS_TOKEN", value: "{{ vault_twingate_access }}" }
  - { key: "TWINGATE_REFRESH_TOKEN", value: "{{ vault_twingate_refresh }}" }
  - { key: "SAMBA_PASSWORD", value: "{{ vault_samba_password }}" }
