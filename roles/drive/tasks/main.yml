---
- name: NTFS-Treiber (ntfs-3g) installieren, falls NTFS-Laufwerke konfiguriert sind
  ansible.builtin.apt:
    name: ntfs-3g
    state: present
    update_cache: true
  when: (host_drives | default([]) | selectattr('fstype', 'defined') | selectattr('fstype', 'equalto', 'ntfs') | list | length) > 0

- name: Mount-Points für konfigurierte Festplatten erstellen
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ host_drives | default([]) }}"
  when: (host_drives | default([]) | length) > 0

- name: fstab-Einträge für konfigurierte Festplatten sicherstellen und einhängen
  ansible.builtin.mount:
    path: "{{ item.path }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype | default('ext4') }}"
    opts: "{{ item.opts | default('defaults,nofail') }}"
    dump: "{{ item.dump | default('0') }}"
    passno: "{{ item.passno | default('0') }}"
    state: "{{ item.state | default('mounted') }}"
  loop: "{{ host_drives | default([]) }}"
  when: (host_drives | default([]) | length) > 0
