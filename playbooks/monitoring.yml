---
- name: node_exporter auf allen überwachten Pis installieren
  hosts: monitoring_targets
  become: true

  vars:
    node_exporter_version: "1.8.2"
    node_exporter_arch_map:
      aarch64: arm64
      armv7l: armv7
    node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] }}"
    node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

  tasks:
    - name: node_exporter-Systembenutzer anlegen
      ansible.builtin.user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    - name: node_exporter herunterladen und entpacken
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_release }}.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "/opt/{{ node_exporter_release }}/node_exporter"

    - name: node_exporter-Binary nach /usr/local/bin kopieren
      ansible.builtin.copy:
        src: "/opt/{{ node_exporter_release }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: yes
        owner: root
        group: root
      register: node_exporter_binary

    - name: systemd-Service für node_exporter anlegen
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      register: node_exporter_service

    - name: node_exporter-Dienst aktivieren und starten
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: "{{ node_exporter_service.changed }}"
        enabled: yes
        state: "{{ 'restarted' if (node_exporter_service.changed or node_exporter_binary.changed) else 'started' }}"

- name: smartctl_exporter auf Pis mit externer Festplatte installieren
  hosts: drive_hosts
  become: true

  vars:
    smartctl_exporter_version: "0.13.0"
    smartctl_exporter_arch_map:
      aarch64: arm64
      armv7l: armv7
    smartctl_exporter_arch: "{{ smartctl_exporter_arch_map[ansible_architecture] }}"
    smartctl_exporter_release: "smartctl_exporter-{{ smartctl_exporter_version }}.linux-{{ smartctl_exporter_arch }}"

  tasks:
    - name: smartmontools installieren
      ansible.builtin.apt:
        name: smartmontools
        state: present
        update_cache: yes

    - name: smartctl_exporter herunterladen und entpacken
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v{{ smartctl_exporter_version }}/{{ smartctl_exporter_release }}.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "/opt/{{ smartctl_exporter_release }}/smartctl_exporter"

    - name: smartctl_exporter-Binary nach /usr/local/bin kopieren
      ansible.builtin.copy:
        src: "/opt/{{ smartctl_exporter_release }}/smartctl_exporter"
        dest: /usr/local/bin/smartctl_exporter
        mode: "0755"
        remote_src: yes
        owner: root
        group: root
      register: smartctl_exporter_binary

    - name: systemd-Service für smartctl_exporter anlegen
      ansible.builtin.copy:
        dest: /etc/systemd/system/smartctl_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus smartctl Exporter
          After=network.target

          [Service]
          User=root
          ExecStart=/usr/local/bin/smartctl_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      register: smartctl_exporter_service

    - name: smartctl_exporter-Dienst aktivieren und starten
      ansible.builtin.systemd:
        name: smartctl_exporter
        daemon_reload: "{{ smartctl_exporter_service.changed }}"
        enabled: yes
        state: "{{ 'restarted' if (smartctl_exporter_service.changed or smartctl_exporter_binary.changed) else 'started' }}"
