---
- name: VPS Basis-Setup und Benutzer anlegen
  hosts: strato_vps
  become: true

  vars:
    vps_user: nico

  vars_files:
    - ../group_vars/strato_vps/vault.yml

  tasks:
    - name: Paketliste aktualisieren
      ansible.builtin.apt:
        update_cache: yes

    - name: Alle Pakete upgraden
      ansible.builtin.apt:
        upgrade: dist

    - name: Nicht mehr benötigte Pakete entfernen
      ansible.builtin.apt:
        autoremove: yes

    - name: Standard Pakete installieren
      ansible.builtin.apt:
        name:
          - sudo
          - htop
          - git
          - curl
        state: present
        update_cache: yes

    - name: Benutzer {{ vps_user }} mit Sudo-Rechten anlegen
      ansible.builtin.user:
        name: "{{ vps_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes
        password: "{{ vault_vps_sudo_password | password_hash('sha512') }}"
        update_password: on_create
        state: present

    - name: .ssh-Verzeichnis für {{ vps_user }} erstellen
      ansible.builtin.file:
        path: "/home/{{ vps_user }}/.ssh"
        state: directory
        owner: "{{ vps_user }}"
        group: "{{ vps_user }}"
        mode: "0700"

    - name: SSH-Schlüssel von root für {{ vps_user }} übernehmen
      ansible.builtin.copy:
        src: /root/.ssh/authorized_keys
        dest: "/home/{{ vps_user }}/.ssh/authorized_keys"
        remote_src: yes
        owner: "{{ vps_user }}"
        group: "{{ vps_user }}"
        mode: "0600"

    - name: SSH-Härtung in sshd_config konfigurieren
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
        - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
        - { regexp: "^#?PubkeyAuthentication", line: "PubkeyAuthentication yes" }
      register: sshd_config_main

    - name: SSH-Härtung als Drop-in-Konfiguration sicherstellen
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
        validate: /usr/sbin/sshd -t -f %s
      register: sshd_config_dropin

    - name: SSH-Dienst bei Konfigurationsänderung neu starten
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      when: sshd_config_main.changed or sshd_config_dropin.changed
